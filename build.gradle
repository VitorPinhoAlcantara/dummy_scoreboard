plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.142'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("src/generated/**/.cache")
}

repositories {
    // The Training Dummy mod this addon extends - published locally via its own
    // `./gradlew publish` (see its build.gradle) to a plain file-based repo, since it isn't on a
    // public maven. Re-run that publish after any change to training_dummy before building here.
    maven {
        name = "TrainingDummyLocal"
        url = uri("../training_dummy/repo")
    }
    // Curios API, dev-test only (see dependencies below) - our code never references Curios types
    // directly (com.trainingdummy.curios.CuriosCompat's public methods don't leak Curios types),
    // so this is just here to let runClient verify curio-equipped snapshots actually work.
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "com.trainingdummy:training_dummy:${trainingdummy_version}"

    compileOnly "maven.modrinth:curios:${curios_version}"
    localRuntime "maven.modrinth:curios:${curios_version}"

    // Not compiled against (no bespoke code for any of these) - just installed for runClient so
    // the scoreboard dummy can be checked against the same mods training_dummy dev-tests with.
    localRuntime "maven.modrinth:artifacts:${artifacts_version}"
    localRuntime "maven.modrinth:jei:${jei_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            trainingdummy_version  : trainingdummy_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
